[package]
name = "kairos-keeper"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
dotenv = "0.15.0"
solana-sdk = { version = "4.1.0", features = ["full"] }
borsh = { version = "1", features = ["derive"] }
base64 = "0.22"
bincode = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpc = { package = "kairos-rpc", path = "../kairos-rpc" }
kairos-db = { path = "../kairos-db" }

[build-dependencies]
serde_json = "1"

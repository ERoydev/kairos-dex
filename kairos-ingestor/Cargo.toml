[package]
name = "kairos-ingestor"
version = "0.1.0"
edition = "2024"


[dependencies]
dotenv = "0.15.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version="0.30.0", features = ["native-tls"] }
futures-util = "0.3.34"
# Solana
solana-sdk = { version = "4.1.0", features = ["full"] }
solana-client = "4.3.0"

borsh = { version = "1", features = ["derive"] }
base64 = "0.22"
bincode = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

kairos-db = { path = "../kairos-db" }
anchor-client = "1.1.2"
perp = { path = "../programs/perp/programs/perp", features = ["no-entrypoint"] }
liquidity-pool = { path = "../programs/liquidity-pool/programs/liquidity-pool", features = ["no-entrypoint"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"], optional = true }
migration = { path = "../kairos-db/migration", optional = true }
derive_more = {version = "2.1.1", features = ["from", "display"]}

